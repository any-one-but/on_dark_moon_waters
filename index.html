<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trackline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <input id="playGameInput" type="file" accept=".json,.txt" hidden />
    <input id="createGameInput" type="file" accept=".json,.txt" hidden />
    <input id="playSaveInput" type="file" accept=".json,.txt" hidden />

    <main class="app-root">
      <section id="homeView" class="view"></section>

      <section id="playView" class="view hidden">
        <aside class="pane play-pane-left">
          <div class="play-pane-scroll">
            <h1 id="playGameName">No game loaded</h1>
            <hr class="panel-rule play-rule" />
            <div class="button-stack">
              <button id="playLoadGameButton" class="button secondary" type="button">
                Load Game File
              </button>
              <button id="playImportSaveButton" class="button secondary" type="button">
                Import Save
              </button>
              <button id="playExportSaveButton" class="button" type="button">
                Export Save
              </button>
              <button id="playRestartButton" class="button secondary" type="button">
                Restart Run
              </button>
              <button id="playBackChoiceButton" class="button secondary hidden" type="button">
                Back One Choice
              </button>
              <button id="playReturnEditorButton" class="button secondary hidden" type="button">
                Return to Editor
              </button>
              <button id="playBackHomeButton" class="button ghost" type="button">
                Return to Menu
              </button>
            </div>
            <div id="playValidationCard" class="hidden">
              <hr class="panel-rule play-rule" />
              <div id="playValidationSummary" class="stack compact"></div>
            </div>
          </div>
        </aside>

        <section class="pane play-pane-center">
          <div id="playLog" class="play-log"></div>
          <div class="choice-panel">
            <div id="playCurrentMessage" class="current-message hidden"></div>
            <hr class="panel-rule play-rule" />
            <div id="playOptions" class="option-list"></div>
          </div>
        </section>

        <aside class="pane play-pane-right">
          <div class="play-pane-scroll">
            <h3>Notes</h3>
            <textarea
              id="playNotes"
              class="notes-field"
              placeholder="Player notes are saved with the run."
            ></textarea>
            <div id="playTrackerCard" class="hidden">
              <hr class="panel-rule play-rule" />
              <h3>Integers</h3>
              <div id="playTrackerGroups" class="stack play-detail-list"></div>
            </div>
            <div id="playFlagsCard" class="hidden">
              <hr class="panel-rule play-rule" />
              <h3>Enums</h3>
              <div id="playFlags" class="stack compact play-detail-list"></div>
            </div>
            <div id="playProfilesCard" class="hidden">
              <hr class="panel-rule play-rule" />
              <h3>Profiles</h3>
              <div id="playProfiles" class="stack compact play-detail-list"></div>
            </div>
          </div>
        </aside>
      </section>

      <section id="createView" class="view hidden">
        <div id="graphViewport" class="graph-viewport create-canvas">
          <div class="hidden">
            <button id="editorNewButton" type="button">New Game</button>
            <button id="editorLoadButton" type="button">Load Game File</button>
            <button id="editorDownloadButton" type="button">Download Game</button>
            <button id="editorTestPlayButton" type="button">Test Play</button>
            <button id="editorBackHomeButton" type="button">Return to Menu</button>
          </div>
          <div id="graphWorld" class="graph-world">
            <svg id="graphConnections" class="graph-connections"></svg>
            <div id="graphNodes" class="graph-nodes"></div>
            <div id="graphOverlays" class="graph-overlays"></div>
          </div>

          <aside class="create-panel create-panel-left">
            <div class="create-panel-head">
              <p class="eyebrow">Create Mode</p>
              <h2 id="editorGameName">Untitled Game</h2>
              <p id="editorStatus" class="copy"></p>
              <div id="editorTabButtons" class="tab-list"></div>
            </div>
            <div id="editorSidebarContent" class="create-panel-scroll"></div>
          </aside>

          <aside id="editorInspectorShell" class="create-panel create-panel-right hidden">
            <div id="editorInspector" class="create-panel-scroll"></div>
          </aside>

          <div class="graph-floating-controls">
            <button id="graphAddNodeButton" class="graph-fab" type="button" title="Add story node" aria-label="Add story node">
              <span class="graph-fab-icon" aria-hidden="true">▤</span>
            </button>
            <button id="graphAddClusterButton" class="graph-fab" type="button" title="Add cluster" aria-label="Add cluster">
              <span class="graph-fab-icon" aria-hidden="true">◌</span>
            </button>
            <button id="graphAddLogicNodeButton" class="graph-fab" type="button" title="Add logic node" aria-label="Add logic node">
              <span class="graph-fab-icon" aria-hidden="true">◇</span>
            </button>
            <button id="graphAddEndNodeButton" class="graph-fab" type="button" title="Place end node" aria-label="Place end node">
              <span class="graph-fab-icon" aria-hidden="true">◎</span>
            </button>
            <button id="graphCenterButton" class="graph-fab" type="button" title="Center graph">
              <span class="graph-fab-icon" aria-hidden="true">⌖</span>
            </button>
            <div class="graph-zoom-cluster">
              <button id="graphZoomOutButton" class="graph-fab" type="button" title="Zoom out" aria-label="Zoom out"><span class="graph-fab-icon" aria-hidden="true">-</span></button>
              <span id="graphZoomLabel" class="zoom-label">100%</span>
              <button id="graphZoomInButton" class="graph-fab" type="button" title="Zoom in" aria-label="Zoom in"><span class="graph-fab-icon" aria-hidden="true">+</span></button>
            </div>
          </div>
        </div>
      </section>
      <div id="menuOverlay" class="menu-overlay"></div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
